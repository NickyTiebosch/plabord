<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Je rooster in je agenda</title>
<link rel="stylesheet" href="../lib/stage.css">
</head>
<body>
<script type="module">
import { tl, buildStage, localBox, tap, highlight, caption, camera, intro, outro, loadBoxes, ready, el, css, mid, appFrame, switchPage } from '../lib/ui.js';
import { iosAlert, subscribeSheet, calendarList } from '../lib/ios.js';

// Het adres van Planbord komt van render.mjs of pdf.mjs (UITLEG_ADRES).
if (!window.UITLEG_ADRES) throw new Error('UITLEG_ADRES ontbreekt');
const FEED = `webcal://${window.UITLEG_ADRES}/feed/…`;
const boxes = await loadBoxes();
const s = buildStage({ title: 'Je rooster in je agenda', chip: 'iPhone' });
const cam = camera(s);
const frame = appFrame(s.screen, ['mijn', 'meer', 'agenda', 'agenda-link'], boxes);
const { mijn, meer, agenda } = frame.pages;
const withLink = frame.pages['agenda-link'];
const alert = iosAlert(s.screen, {
  title: 'Abonneer op agenda?',
  message: FEED,
  cancel: 'Annuleer',
  confirm: 'Abonneer',
});
const sheet = subscribeSheet(s.screen, { name: 'Planbord – Mijn rooster', url: FEED });
const calendar = calendarList(s.screen, [
  { day: 'Vandaag · maandag 5 oktober', today: true, title: 'Dienst Den Bosch 07:30–18:00', sub: '07:30 – 18:00' },
  { day: 'dinsdag 6 oktober', title: 'Dienst Den Bosch 07:30–18:00', sub: '07:30 – 18:00' },
  { day: 'woensdag 7 oktober', title: 'Dienst Eindhoven 07:30–18:00', sub: '07:30 – 18:00' },
  { day: 'donderdag 8 oktober', title: 'Dienst Den Bosch 07:30–18:00', sub: '07:30 – 18:00' },
  { day: 'zaterdag 10 oktober', title: 'Invallen Breda 07:30–13:00', sub: '07:30 – 13:00' },
  { day: 'woensdag 14 oktober', title: 'Afwezig', sub: 'hele dag', color: '#e11d48' },
]);
el('div', 'island', s.screen);
const fx = css(el('div', 'layer', s.screen), { zIndex: 85, overflow: 'visible' });

await ready();
const alertBox = localBox(alert.alert, s.screen);
css(alert.alert, { top: `${(844 - alertBox.h) / 2}px` });
const confirm = localBox(alert.confirm, s.screen);
const addBtn = localBox(sheet.add, s.screen);
const TOP = frame.top;
const on = (b) => ({ x: b.x, y: TOP + b.y, w: b.w, h: b.h });
// Sinds fase 5 (V44) staat Agenda op de telefoon onder Meer.
const navMore = (() => { const b = boxes.mijn['nav:Meer']; return { x: b.x, y: TOP + b.y, w: b.width, h: b.height }; })();
const moreAgenda = on(boxes.meer.agenda);
// Alles na stap 1 schuift zoveel seconden op, voor de tik op Meer.
const D = 1.6;
const makeLink = on(boxes.agenda.makeLink);
const addToCalendar = on(boxes['agenda-link'].add);

intro(s);
tl.prop(calendar.layer, 'opacity', 0).to(17.4 + D, 17.8 + D, 1, 'out');

// 1. Naar Agenda, via Meer
caption(s.captions, 1, 'Tik onderin op <b>Meer</b> en dan op <b>Agenda</b>', null, 1.2, 4.6 + D);
highlight(fx, navMore, 1.8, 2.9, { pad: 0, radius: 12 });
tap(fx, 3.05, mid(navMore).x, mid(navMore).y, { from: { x: 250, y: 600 } });
switchPage(mijn, meer, 3.2);
highlight(fx, moreAgenda, 3.6, 4.8, { pad: 2, radius: 12 });
tap(fx, 4.95, mid(moreAgenda).x, mid(moreAgenda).y);
switchPage(meer, agenda, 5.1);

// 2. Link maken
caption(s.captions, 2, 'Tik bij <b>Mijn rooster</b> op <b>Link maken</b>', 'Je eigen diensten en afwezigheid.', 4.6 + D, 8.4 + D);
cam.zoom(4.7 + D, 5.5 + D, mid(makeLink), 1.45, { x: 270, y: 420 });
highlight(fx, makeLink, 5.6 + D, 7.45 + D, { pad: 4, radius: 12 });
tap(fx, 7.6 + D, mid(makeLink).x, mid(makeLink).y);
switchPage(agenda, withLink, 7.75 + D);

// 3. Toevoegen aan agenda
caption(s.captions, 3, 'Tik op <b>Toevoegen aan agenda</b>', 'Bewaar de link: je ziet hem maar één keer.', 8.4 + D, 12.2 + D);
cam.zoom(8.5 + D, 9.3 + D, mid(addToCalendar), 1.45, { x: 270, y: 430 });
highlight(fx, addToCalendar, 9.4 + D, 11.45 + D, { pad: 4, radius: 12 });
tap(fx, 11.6 + D, mid(addToCalendar).x, mid(addToCalendar).y);
tl.prop(alert.dim, 'opacity', 0).to(11.8 + D, 12.05 + D, 1, 'out').to(14.4 + D, 14.65 + D, 0, 'in');
tl.prop(alert.alert, 'opacity', 0).to(11.8 + D, 12.05 + D, 1, 'out').to(14.4 + D, 14.6 + D, 0, 'in');
tl.prop(alert.alert, 'scale', 1.12).to(11.8 + D, 12.15 + D, 1, 'out');
cam.zoom(12.0 + D, 12.8 + D, mid(confirm), 1.3, { x: 270, y: 430 });

// 4. Abonneer en Voeg toe
caption(s.captions, 4, 'Kies <b>Abonneer</b> en daarna <b>Voeg toe</b>', null, 12.2 + D, 17.4 + D);
highlight(fx, confirm, 12.9 + D, 14.05 + D, { pad: 2, radius: 10 });
tap(fx, 14.2 + D, mid(confirm).x, mid(confirm).y);
tl.prop(sheet.sheet, 'y', 820).to(14.6 + D, 15.05 + D, 0, 'outQuint').to(17.2 + D, 17.6 + D, 820, 'in');
cam.zoom(14.9 + D, 15.6 + D, mid(addBtn), 1.35, { x: 320, y: 380 });
highlight(fx, addBtn, 15.7 + D, 16.85 + D, { pad: 7, radius: 10 });
tap(fx, 17.0 + D, mid(addBtn).x, mid(addBtn).y);
cam.reset(17.2 + D, 18.0 + D);

// 5. In de agenda
caption(s.captions, 'ok', 'Je diensten staan in je <b>agenda</b>', 'Wijzigingen komen er vanzelf in. Een iPhone haalt ze meestal binnen een uur op.', 17.4 + D, 22.6 + D);
cam.zoom(18.6 + D, 19.6 + D, { x: 195, y: 330 }, 1.25, { x: 270, y: 420 });
cam.reset(21.8 + D, 22.6 + D);

outro(s, 22.6 + D, 'Klaar!', 'Google Agenda of Outlook? Op de uitlegpagina staat hoe dat gaat.');
tl.end(25.6 + D);
window.poster = 10.5 + D;
tl.seek(0);
window.ready = true;
</script>
</body>
</html>
