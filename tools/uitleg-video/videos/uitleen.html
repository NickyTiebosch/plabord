<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Een auto uitlenen</title>
<link rel="stylesheet" href="../lib/stage.css">
</head>
<body>
<script type="module">
// Fase 5: Sanne geeft de VW Polo opnieuw uit aan Mobiliteit en meldt de VW Transporter van de
// werkplaats retour. De schermen en de auto's komen uit capture.mjs en demo-data.mjs.
import { tl, buildStage, tap, highlight, caption, camera, intro, outro, loadBoxes, ready, el, css, mid, appFrame, switchPage } from '../lib/ui.js';

const boxes = await loadBoxes();
const s = buildStage({ title: 'Een auto uitlenen' });
const cam = camera(s);
const frame = appFrame(
  s.screen,
  ['mijn', 'uitleen', 'uitleen-nieuw', 'uitleen-nieuw-gevuld', 'uitleen-aangemeld', 'uitleen-retour', 'uitleen-retour-gevuld', 'uitleen-klaar'],
  boxes,
);
const P = frame.pages;
el('div', 'island', s.screen);
const fx = css(el('div', 'layer', s.screen), { zIndex: 85, overflow: 'visible' });
await ready();

const TOP = frame.top;
const on = (b, scroll = 0) => ({ x: b.x, y: TOP + b.y - scroll, w: b.w, h: b.h });
const nav = (label) => { const b = boxes.mijn[`nav:${label}`]; return { x: b.x, y: TOP + b.y, w: b.width, h: b.height }; };
const FORM_SCROLL = 200;
const SUBMIT_SCROLL = 420;
const DONE_SCROLL = 120;

const registrations = nav('Registraties');
const add = on(boxes.uitleen.add);
const option = on(boxes['uitleen-nieuw'].option);
const filled = boxes['uitleen-nieuw-gevuld'];
const fields = on({ x: filled.plate.x, y: filled.plate.y, w: filled.plate.w, h: filled.handedTo.y + filled.handedTo.h - filled.plate.y }, FORM_SCROLL);
const submit = on(filled.submit, SUBMIT_SCROLL);
const returnUsed = on(boxes['uitleen-aangemeld'].returnUsed);
const odometer = on(boxes['uitleen-retour'].odometer);
const report = on(boxes['uitleen-retour'].submit);
const returned = on(boxes['uitleen-klaar'].returned, DONE_SCROLL);
const undo = on(boxes['uitleen-klaar'].undo, DONE_SCROLL);

intro(s);

// 1. Naar Registraties
caption(s.captions, 1, 'Tik onderin op <b>Registraties</b>', null, 1.2, 4.4);
highlight(fx, registrations, 1.8, 3.0, { pad: 0, radius: 12 });
tap(fx, 3.15, mid(registrations).x, mid(registrations).y, { from: { x: 250, y: 600 } });
switchPage(P.mijn, P.uitleen, 3.3);

// 2. Auto aanmelden
caption(s.captions, 2, 'Tik op <b>Auto aanmelden</b>', 'Daaronder zie je welke auto’s nu uit staan.', 4.4, 7.6);
cam.zoom(4.5, 5.3, mid(add), 1.4, { x: 270, y: 400 });
highlight(fx, add, 5.4, 6.8, { pad: 4, radius: 12 });
tap(fx, 6.95, mid(add).x, mid(add).y);
switchPage(P.uitleen, P['uitleen-nieuw'], 7.1);

// 3. Opnieuw uitgeven
caption(s.captions, 3, 'Dezelfde auto als laatst? Tik hem aan bij <b>Opnieuw uitgeven</b>', 'De auto’s van je vestiging uit de laatste 14 dagen.', 7.6, 11.0);
cam.zoom(7.7, 8.4, mid(option), 1.4, { x: 270, y: 400 });
highlight(fx, option, 8.5, 10.1, { pad: 4, radius: 12 });
tap(fx, 10.25, mid(option).x, mid(option).y);
switchPage(P['uitleen-nieuw'], P['uitleen-nieuw-gevuld'], 10.4);

// 4. Ingevuld: Aanmelden
caption(s.captions, 4, 'Alles staat al ingevuld. Tik op <b>Aanmelden</b>', 'Een andere auto? Vul kenteken, model, bestemming en aan wie zelf in.', 11.0, 16.6);
cam.reset(11.0, 11.8);
tl.prop(P['uitleen-nieuw-gevuld'].content, 'scroll', 0).to(11.2, 12.0, FORM_SCROLL, 'inOut').to(13.8, 14.5, SUBMIT_SCROLL, 'inOut');
highlight(fx, fields, 12.1, 13.6, { pad: 6, radius: 14 });
highlight(fx, submit, 14.6, 15.8, { pad: 4, radius: 12 });
tap(fx, 15.95, mid(submit).x, mid(submit).y);
switchPage(P['uitleen-nieuw-gevuld'], P['uitleen-aangemeld'], 16.1);

// 5. Retour · ingezet
caption(s.captions, 5, 'Komt er een auto terug? Tik bij die auto op <b>Retour · ingezet</b>', 'Was hij niet nodig? Dan tik je op Retour · niet ingezet.', 16.6, 20.4);
cam.zoom(16.7, 17.5, mid(returnUsed), 1.4, { x: 270, y: 430 });
highlight(fx, returnUsed, 17.6, 19.4, { pad: 4, radius: 12 });
tap(fx, 19.55, mid(returnUsed).x, mid(returnUsed).y);
switchPage(P['uitleen-aangemeld'], P['uitleen-retour'], 19.7);

// 6. Kilometerstand en Retour melden
caption(s.captions, 6, 'Vul de kilometerstand in en tik op <b>Retour melden</b>', 'De kilometerstand mag ook leeg blijven.', 20.4, 24.6);
cam.zoom(20.5, 21.2, mid(odometer), 1.4, { x: 270, y: 400 });
highlight(fx, odometer, 21.3, 22.3, { pad: 4, radius: 12 });
switchPage(P['uitleen-retour'], P['uitleen-retour-gevuld'], 21.9);
cam.zoom(22.5, 23.1, mid(report), 1.4, { x: 270, y: 430 });
highlight(fx, report, 23.2, 24.0, { pad: 4, radius: 12 });
tap(fx, 24.15, mid(report).x, mid(report).y);
switchPage(P['uitleen-retour-gevuld'], P['uitleen-klaar'], 24.3);

// 7. Ongedaan maken
caption(s.captions, 7, 'Verkeerd getikt? Tik bij <b>Vandaag retour</b> op <b>Ongedaan maken</b>', 'Dat kan op dezelfde dag. Daarna vraag je het je teamleider.', 24.6, 29.2);
cam.reset(24.6, 25.3);
tl.prop(P['uitleen-klaar'].content, 'scroll', 0).to(24.8, 25.6, DONE_SCROLL, 'inOut');
highlight(fx, returned, 25.7, 26.9, { pad: 2, radius: 10 });
cam.zoom(26.6, 27.3, mid(undo), 1.4, { x: 270, y: 430 });
highlight(fx, undo, 27.4, 28.9, { pad: 4, radius: 12 });
cam.reset(28.9, 29.5);

outro(s, 29.2, 'Zo werkt het', 'Klantgegevens zijn niet nodig. Iets verkeerd aangemeld? Je <b>teamleider</b> kan het corrigeren.');
tl.end(32.2);
window.poster = 12.9;
tl.seek(0);
window.ready = true;
</script>
</body>
</html>
